# ---------------------------------------------------------------------------
# Host nginx vhost (runs on the VPS itself, NOT inside docker).
# Copy to /etc/nginx/sites-available/elahefarahbakhsh.ir and symlink it.
#
#   FRONTEND_BIND_PORT = 8092  (static React build)
#   BACKEND_BIND_PORT  = 8011  (gunicorn / Django)
#
# Run certbot AFTER the plain-HTTP block below already answers on port 80.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name elahefarahbakhsh.ir www.elahefarahbakhsh.ir;

    # Certbot writes its challenge here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elahefarahbakhsh.ir www.elahefarahbakhsh.ir;

    ssl_certificate     /etc/letsencrypt/live/elahefarahbakhsh.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elahefarahbakhsh.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_artist:10m;

    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- Django ----------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /django-admin/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images and Django static files (served by the backend container).
    location /media/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
    }

    location = /healthz  { proxy_pass http://127.0.0.1:8011; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8011; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8011; }

    # ---- React site ------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

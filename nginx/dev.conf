upstream backend_upstream { server backend:8000; }
upstream vite_upstream   { server frontend:5173; }

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # --- API + Django admin ------------------------------------------- #
    location /api/            { proxy_pass http://backend_upstream; include /etc/nginx/proxy_params_local; }
    location /django-admin/   { proxy_pass http://backend_upstream; include /etc/nginx/proxy_params_local; }
    location /healthz         { proxy_pass http://backend_upstream; include /etc/nginx/proxy_params_local; }
    location /robots.txt      { proxy_pass http://backend_upstream; include /etc/nginx/proxy_params_local; }
    location /sitemap.xml     { proxy_pass http://backend_upstream; include /etc/nginx/proxy_params_local; }

    # --- files --------------------------------------------------------- #
    location /media/  { alias /var/www/media/;  access_log off; expires 7d; }
    location /static/ { alias /var/www/static/; access_log off; expires 7d; }

    # --- Vite dev server (with HMR websocket) -------------------------- #
    location / {
        proxy_pass http://vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

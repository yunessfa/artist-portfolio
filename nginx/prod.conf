# Rendered by nginx's envsubst using ${PUBLIC_DOMAIN}.
upstream backend_upstream { server backend:8000; }

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss application/rss+xml image/svg+xml
           application/manifest+json font/woff font/woff2;

# --- HTTP: ACME challenge + redirect to HTTPS --------------------------- #
server {
    listen 80;
    server_name ${PUBLIC_DOMAIN} www.${PUBLIC_DOMAIN};

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS -------------------------------------------------------------- #
server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_DOMAIN} www.${PUBLIC_DOMAIN};

    ssl_certificate     /etc/nginx/certs/live/${PUBLIC_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/${PUBLIC_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 30m;

    # --- backend ------------------------------------------------------- #
    location /api/ {
        proxy_pass http://backend_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
    location /django-admin/ {
        proxy_pass http://backend_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /healthz  { proxy_pass http://backend_upstream; include /etc/nginx/snippets/proxy.conf; access_log off; }
    location = /robots.txt  { proxy_pass http://backend_upstream; include /etc/nginx/snippets/proxy.conf; }
    location = /sitemap.xml { proxy_pass http://backend_upstream; include /etc/nginx/snippets/proxy.conf; }

    # --- media: long cache, immutable variants ------------------------- #
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # --- Django static ------------------------------------------------- #
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # --- hashed SPA bundles -------------------------------------------- #
    location /assets/ {
        root /var/www/frontend;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # --- SPA fallback (never cache index.html) ------------------------- #
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

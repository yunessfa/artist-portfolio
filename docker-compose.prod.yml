name: ${COMPOSE_PROJECT_NAME:-artistportfolio}

# Production topology for a VPS that already hosts other projects.
# Nothing is published on 0.0.0.0 -- every port is bound to 127.0.0.1 and the
# host nginx (already installed on the server) terminates TLS and proxies in.
#
#   host nginx :443  ->  127.0.0.1:${FRONTEND_BIND_PORT:-8092}   static site
#                    ->  127.0.0.1:${BACKEND_BIND_PORT:-8011}    /api, /media, /static, /django-admin

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artistportfolio}
      POSTGRES_USER: ${POSTGRES_USER:-artist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-artist} -d ${POSTGRES_DB:-artistportfolio}",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_COLLECTSTATIC: "1"
    ports:
      - "127.0.0.1:${BACKEND_BIND_PORT:-8011}:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # One-shot: builds the React site and publishes it into the shared volume.
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost}
    command:
      - sh
      - -c
      - |
        rm -rf /var/www/frontend/*
        cp -r /dist/. /var/www/frontend/
        echo "frontend published"
    volumes:
      - frontend_dist:/var/www/frontend
    restart: "no"
    networks:
      - internal

  frontend:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_BIND_PORT:-8092}:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/spa.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  postgres_data:
  media_data:
  static_data:
  frontend_dist:

networks:
  internal:
    driver: bridge
